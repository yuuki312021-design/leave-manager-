services:
  - type: web
    name: leave-manager
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: cron
    name: leave-manager-notifications
    env: node
    region: singapore
    schedule: "0 * * * *"
    buildCommand: ""
    startCommand: >-
      curl -sf -X GET
      -H "Authorization: Bearer $CRON_SECRET"
      "$NEXTAUTH_URL/api/cron/notifications"
    envVars:
      - key: NEXTAUTH_URL
        sync: false
      - key: CRON_SECRET
        sync: false
